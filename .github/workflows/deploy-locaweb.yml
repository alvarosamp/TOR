name: Deploy via FTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Locaweb FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deployment context
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Workspace: $GITHUB_WORKSPACE"
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build FTP web payload
        run: npm run build:ftp

      - name: Verify FTP payload
        run: |
          echo "Files ready for FTP:"
          find web -maxdepth 3 -type f | sort
          echo "Total files:"
          find web -type f | wc -l
          echo "Dist size:"
          du -sh web
          test -f web/index.html
          echo "index.html found"
          test -f web/default.htm
          echo "default.htm found"
          test -f web/default.html
          echo "default.html found"
          test -f web/web.config
          echo "web.config found"

      - name: FTP Deploy Locaweb
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: web
          options: --verbose
